<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Watchdog</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: linear-gradient(135deg, #1e3a8a, #0f172a);
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      max-width: 600px;
    }
    h1 {
      font-size: 2.5em;
      margin: 0 0 10px 0;
    }
    p {
      font-size: 1.1em;
      opacity: 0.9;
      line-height: 1.6;
    }
    .status {
      margin-top: 30px;
      padding: 15px;
      background: rgba(34, 197, 94, 0.1);
      border: 2px solid #22c55e;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📡 URL Watchdog</h1>
    <p>A web-based URL monitoring application that watches URLs for specific keywords and sends notifications when matches are found.</p>
    <div class="status">
      <strong>✅ GitHub Pages is now active!</strong>
      <p>The React frontend is being built automatically.</p>
    </div>
  </div>
</body>
</html>
